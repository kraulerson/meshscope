name: Release — meshscope

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: meshscope-macos-arm64
            binary_name: main.bin
          - os: ubuntu-latest
            artifact_name: meshscope-linux-x64
            binary_name: main.bin
          - os: windows-latest
            artifact_name: meshscope-windows-x64
            binary_name: main.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Nuitka
        run: pip install nuitka

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libxkbcommon0

      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --include-module=vtkmodules.vtkRenderingOpenGL2 \
            --include-module=vtkmodules.vtkRenderingCore \
            --include-module=vtkmodules.vtkRenderingFreeType \
            --include-module=vtkmodules.vtkInteractionStyle \
            --include-module=vtkmodules.vtkFiltersSources \
            --include-module=vtkmodules.vtkFiltersGeneral \
            --include-module=vtkmodules.vtkFiltersCore \
            --include-module=vtkmodules.vtkCommonCore \
            --include-module=vtkmodules.vtkCommonDataModel \
            --include-module=vtkmodules.vtkCommonExecutionModel \
            --include-module=vtkmodules.vtkCommonMath \
            --include-module=vtkmodules.vtkCommonTransforms \
            --include-module=vtkmodules.vtkIOGeometry \
            --include-module=vtkmodules.vtkIOXML \
            --include-module=vtkmodules.vtkIOPLY \
            --include-module=vtkmodules.vtkIOLegacy \
            --include-module=vtkmodules.qt.QVTKRenderWindowInteractor \
            --include-module=vtkmodules.vtkInteractionWidgets \
            --nofollow-import-to=vtkmodules.test \
            --nofollow-import-to=vtkmodules.web \
            --nofollow-import-to=vtkmodules.wx \
            --nofollow-import-to=vtkmodules.tk \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=PIL \
            --include-package=meshscope \
            --include-package=trimesh \
            --include-package=numpy \
            --output-dir=dist/ \
            --company-name="meshscope" \
            --product-name="meshscope" \
            --product-version="0.2.0.0" \
            src/meshscope/main.py

      - name: Package artifact
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "${{ matrix.artifact_name }}.zip" main.dist/
          else
            tar czf "${{ matrix.artifact_name }}.tar.gz" main.dist/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o release-files/sbom.json --format json || echo "SBOM generation failed — continuing without it"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
