name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps

      - name: Install dev tools
        run: pip install ruff mypy pip-audit pip-licenses

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/meshscope/

      - name: Security - SAST (Semgrep)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit

      - name: Security - Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security - Dependency audit
        run: pip-audit

      - name: Security - License check
        run: pip-licenses --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3)"

  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgl1 libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps

      - name: Install dev tools
        run: pip install pytest pytest-qt

      # QVTKRenderWindowInteractor hands QWidget.winId() to
      # vtkRenderWindow.SetWindowInfo(), which casts it to a native pointer and
      # dereferences it. The offscreen QPA plugin returns synthetic handles, so
      # that cast segfaults. Linux therefore gets a real X server (xvfb) plus
      # software GL (llvmpipe) and runs the full suite, render-window tests
      # included. See tests/ui/_native_window.py.
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a pytest || [ $? -eq 5 ]
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

      # macOS and Windows runners provide no GL context usable by VTK, so they
      # run headless; the render-window tests skip themselves rather than crash.
      - name: Run tests (macOS/Windows, offscreen)
        if: runner.os != 'Linux'
        shell: bash
        run: pytest || [ $? -eq 5 ]
        env:
          QT_QPA_PLATFORM: offscreen

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Phase gate check
        if: hashFiles('.claude/phase-state.json') != ''
        run: bash scripts/check-phase-gate.sh 2>/dev/null || echo "Phase gate check script not found — skipping"

      - name: Changelog check
        run: bash scripts/check-changelog.sh 2>/dev/null || true

      - name: Session state check
        run: bash scripts/check-session-state.sh 2>/dev/null || true
